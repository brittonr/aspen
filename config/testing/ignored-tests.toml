# Reviewed inventory of every `#[ignore]` test, enforced by `scripts/ci-coverage.py ignored-tests`
# (flake check `ci-coverage-audit`). Add, move, or remove an entry together with its `#[ignore]`.
#
# category: closed prerequisite category; the script fixes which dispositions each category allows.
# disposition: rail (a named same-host rail selects and runs it), environment-blocked (needs
#   infrastructure CI cannot provision), or reviewed-exclusion (diagnostic or role entrypoint).
# rail/selector: `nix:<flake check>` or `workflow:<file>` and the selector text that rail uses. A Nix
#   rail's own binding (and the Nix files it imports) must hold the selector and run
#   `ci-coverage.py ignored-rail-evidence --rail nix:<flake check>` on its libtest output, which requires
#   this test to have passed. A workflow rail must pass the selector to a `cargo test ... --ignored` command.


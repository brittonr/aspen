\* NON-DERIVED intersection exercise: derive_quorums(4) gives superquorum 4,
\* but this instance uses superquorum 3 and recovery quorum 3 so that recovery
\* selection is load-bearing (3 + 2 * 3 > 2 * 4) within the campaign budget.
\* The derived five-replica instance (3,710,344 distinct safety states) does
\* not fit the 180 s per-checker limit. Two views (one view change).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Replicas = {r1, r2, r3, r4}
    Proposer = r1
    QuorumSize = 3
    SuperQuorumSize = 3
    QuorumsDerived = FALSE
    Commands = {c1, c2}
    MaxView = 2
    EnforcePromises = TRUE
INVARIANTS
    TypeOK
    CommittedOrderAgreement
    Recoverability
    ExecutionOrderAgreement
    LinearizableConflictOrder
    AtMostOnceApplication
PROPERTIES
    RecoveryEventuallyResumes

\* Deliberate model mutant: a two-replica fast superquorum that need not meet a
\* two-replica recovery quorum in enough replicas (RecoveryThreshold 1).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Replicas = {r1, r2, r3}
    Proposer = r1
    QuorumSize = 2
    SuperQuorumSize = 2
    QuorumsDerived = FALSE
    Commands = {c1, c2}
    MaxView = 3
    EnforcePromises = TRUE
INVARIANTS
    TypeOK
    CommittedOrderAgreement
    Recoverability
    ExecutionOrderAgreement
    LinearizableConflictOrder
    AtMostOnceApplication
PROPERTIES
    RecoveryEventuallyResumes

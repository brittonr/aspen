\* Elections, conflicting-suffix truncation, commitment, compaction, restarts and
\* duplicate delivery over four terms (the shortest previous-term commitment
\* counterexample needs four).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    QuorumCount = 2
    MaxTerm = 4
    MaxLogLen = 1
    MaxMessageEntries = 1
    MaxInFlight = 1
    MaxReads = 0
    Duplicates = TRUE
    Restarts = TRUE
    Mutation = "none"
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    CommitWithinLog
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    ReadIndexLinearizable

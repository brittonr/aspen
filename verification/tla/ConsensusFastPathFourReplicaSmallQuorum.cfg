\* Deliberate model mutant of the four-replica exercise: a two-replica recovery
\* quorum (2 + 2 * 3 = 2 * 4), so recovery cannot select a unique command.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Replicas = {r1, r2, r3, r4}
    Proposer = r1
    QuorumSize = 2
    SuperQuorumSize = 3
    QuorumsDerived = FALSE
    Commands = {c1, c2}
    MaxView = 2
    EnforcePromises = TRUE
INVARIANTS
    TypeOK
    CommittedOrderAgreement
    Recoverability
    ExecutionOrderAgreement
    LinearizableConflictOrder
    AtMostOnceApplication
PROPERTIES
    RecoveryEventuallyResumes

\* Multi-entry replication over three terms: prev-log matching, nextIndex
\* backoff, conflicting-suffix truncation and snapshot install.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Server = {s1, s2, s3}
    Nil = Nil
    QuorumCount = 2
    MaxTerm = 3
    MaxLogLen = 2
    MaxMessageEntries = 1
    MaxInFlight = 1
    MaxReads = 0
    Duplicates = TRUE
    Restarts = TRUE
    Mutation = "none"
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    CommitWithinLog
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    ReadIndexLinearizable

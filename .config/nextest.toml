nextest-version = { required = "0.9.136", recommended = "0.9.136" }

[store]
dir = "target/nextest"

[profile.default]
fail-fast = false
retries = 0
flaky-result = "fail"
status-level = "fail"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "10s" }
leak-timeout = { period = "1s", result = "fail" }
global-timeout = "30m"

# Reviewed budget for native capability producer scenarios (one scenario per test).
# World scenarios capture/restore through the runtime-spine profile, which measures the
# executing debug test binary via /proc/self/exe on every run; control-plane scenarios
# start, SIGKILL and restart three replica processes over real Iroh and Redb. Each test
# still runs exactly one scenario; the cap bounds a loaded debug host, not a retry.
[[profile.default.overrides]]
filter = 'package(molten) & test(/capability_qualification::products::(world|control_plane)::tests::/)'
slow-timeout = { period = "60s", terminate-after = 4, grace-period = "10s" }

[profile.ci]
inherits = "default"
default-filter = 'package(molten)'
test-threads = 4
global-timeout = "45m"
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }
junit = { path = "junit.xml", report-name = "molten-ci", store-failure-output = true, store-success-output = false }

[profile.deterministic]
inherits = "default"
default-filter = 'package(molten) & not test(/live|vm|dogfood|soak|exploratory/)'
test-threads = 4
global-timeout = "20m"
slow-timeout = { period = "10s", terminate-after = 1, grace-period = "5s" }
junit = { path = "junit.xml", report-name = "molten-deterministic", store-failure-output = true, store-success-output = false }

[profile.exploratory]
inherits = "default"
default-filter = 'package(molten)'
retries = 1
flaky-result = "pass"
status-level = "retry"
final-status-level = "flaky"
global-timeout = "45m"
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }
junit = { path = "junit.xml", report-name = "molten-exploratory", store-failure-output = true, store-success-output = false }

# Extracted no_std + alloc kernels: every unit and Hegel property test of the pure crates.
[profile.no-std-kernels]
inherits = "deterministic"
default-filter = 'package(molten-composition-core) | package(molten-fastpath-core) | package(molten-preserves-core) | package(molten-raft-core) | package(molten-reliability-model-core) | package(molten-runtime-admission-core) | package(molten-wasm-policy-core)'
junit = { path = "junit.xml", report-name = "molten-no-std-kernels", store-failure-output = true, store-success-output = false }

[profile.fast-core]
inherits = "deterministic"
default-filter = 'package(molten) & test(/hardening|bounded|preserves|profile|receipt/) & not test(/live|vm|dogfood|soak|exploratory/)'
junit = { path = "junit.xml", report-name = "molten-fast-core", store-failure-output = true, store-success-output = false }

[profile.harness]
inherits = "deterministic"
default-filter = 'package(molten) & test(/harness|replay|repro|gate|receipt/) & not test(/live|vm|dogfood|soak|exploratory/)'
junit = { path = "junit.xml", report-name = "molten-harness", store-failure-output = true, store-success-output = false }

[profile.cli]
inherits = "ci"
default-filter = 'package(molten) & test(/cli|cliharness|command|receipt/) & not test(/live|vm|dogfood|soak|exploratory/)'
junit = { path = "junit.xml", report-name = "molten-cli", store-failure-output = true, store-success-output = false }

[profile.distributed-simulation]
inherits = "deterministic"
default-filter = 'package(molten) & test(/distributed|simulation|fault|two_peer|remote/) & not test(/live|vm|dogfood|soak|exploratory/)'
junit = { path = "junit.xml", report-name = "molten-distributed-simulation", store-failure-output = true, store-success-output = false }

# Outside-in scenarios run real node processes over the real Iroh transport and
# real local Redb stores. Each scenario declares its own process, wall-clock, and
# output budgets; results are integration evidence only, not production,
# simulation-replacement, or performance evidence. Zero retries: a flaky result fails.
[profile.outside-in]
inherits = "ci"
default-filter = 'package(molten) & test(/outside_in/)'
test-threads = 2
global-timeout = "20m"
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }
junit = { path = "junit.xml", report-name = "molten-outside-in", store-failure-output = true, store-success-output = false }

[profile.vm-platform]
inherits = "ci"
default-filter = 'package(molten) & test(/vm|nixos|platform/)'
global-timeout = "60m"
junit = { path = "junit.xml", report-name = "molten-vm-platform", store-failure-output = true, store-success-output = false }

[profile.dogfood-soak]
inherits = "ci"
default-filter = 'package(molten) & test(/dogfood|soak|release/)'
global-timeout = "60m"
junit = { path = "junit.xml", report-name = "molten-dogfood-soak", store-failure-output = true, store-success-output = false }

nextest-version = { required = "0.9.136", recommended = "0.9.136" }

[store]
dir = "target/nextest"

[profile.default]
fail-fast = false
retries = 0
flaky-result = "fail"
status-level = "fail"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "10s" }
leak-timeout = { period = "1s", result = "fail" }
global-timeout = "30m"

[profile.ci]
inherits = "default"
test-threads = 4
global-timeout = "45m"
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }
junit = { path = "junit.xml", report-name = "molten-ci", store-failure-output = true, store-success-output = false }

[profile.deterministic]
inherits = "default"
test-threads = 4
global-timeout = "20m"
slow-timeout = { period = "10s", terminate-after = 1, grace-period = "5s" }
junit = { path = "junit.xml", report-name = "molten-deterministic", store-failure-output = true, store-success-output = false }

[profile.exploratory]
inherits = "default"
retries = 1
flaky-result = "pass"
status-level = "retry"
final-status-level = "flaky"
global-timeout = "45m"
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }
junit = { path = "junit.xml", report-name = "molten-exploratory", store-failure-output = true, store-success-output = false }

[profile.fast-core]
inherits = "deterministic"
junit = { path = "junit.xml", report-name = "molten-fast-core", store-failure-output = true, store-success-output = false }

[profile.harness]
inherits = "deterministic"
junit = { path = "junit.xml", report-name = "molten-harness", store-failure-output = true, store-success-output = false }

[profile.cli]
inherits = "ci"
junit = { path = "junit.xml", report-name = "molten-cli", store-failure-output = true, store-success-output = false }

[profile.distributed-simulation]
inherits = "deterministic"
junit = { path = "junit.xml", report-name = "molten-distributed-simulation", store-failure-output = true, store-success-output = false }

[profile.vm-platform]
inherits = "ci"
global-timeout = "60m"
junit = { path = "junit.xml", report-name = "molten-vm-platform", store-failure-output = true, store-success-output = false }

[profile.dogfood-soak]
inherits = "ci"
global-timeout = "60m"
junit = { path = "junit.xml", report-name = "molten-dogfood-soak", store-failure-output = true, store-success-output = false }

id: node-state-root-reacquisition
language: Rust
severity: error
message: Inner node-state and job execution code must carry an opened authority object instead of reopening an ambient root.
metadata:
  posture: blocking
  surface: node-state-carried-authority
  non_claim: structural-authority-threading-only
files:
  - src/node/ingress/*.rs
  - src/node/daemon/dispatch/gating.rs
  - src/node/daemon/dispatch/handlers.rs
  - src/node/daemon/dispatch/installs.rs
  - src/node/daemon/dispatch/launches.rs
  - src/node/daemon/encoding/sends.rs
  - src/node/daemon/encoding/transports.rs
  - src/node/daemon/listen/endpoints.rs
  - src/node/daemon/live/inbound.rs
  - src/node/daemon/records/fields.rs
  - src/node/daemon/records/guards.rs
  - src/node/daemon/service/draining.rs
  - src/node/daemon/service/ticking.rs
  - src/node/daemon/stamping/ingresses.rs
  - src/node/daemon/stamping/narration.rs
  - src/node/daemon/stamping/operations.rs
  - src/node/daemon/stamping/overview.rs
  - src/node/daemon/stamping/phrasing.rs
  - src/node/daemon/stamping/services.rs
  - src/node/daemon/stamping/stamps.rs
  - src/node/daemon/state/leases.rs
  - src/node/daemon/state/paths.rs
  - src/node/daemon/state/storage.rs
  - src/node/daemon/state/writers.rs
  - src/node/daemon/trust/admissibility.rs
  - src/node/daemon/trust/mandates.rs
  - src/node/daemon/trust/newcomers.rs
  - src/node/parts/identity/p001/body.rs
  - src/node/parts/identity/p004/body.rs
  - src/job/parts/dag/p009/body.rs
  - src/job/parts/dag/p030/body.rs
  - src/job/parts/dag/p017/body.rs
  - src/job/parts/dag/p033/body.rs
  - tools/ast-grep/runtime-authority/fixtures/positive/node_state_ambient_authority.rs
  - tools/ast-grep/runtime-authority/fixtures/negative/node_state_carried_authority.rs
ignores:
  - "**/tests/**"
  - src/node/ingress/tests.rs
rule:
  any:
    - pattern: crate::node_state::DirectoryRoot::open($PATH)
    - pattern: crate::node_state::DirectoryRoot::open_existing($PATH)
    - pattern: DirectoryRoot::open($PATH)
    - pattern: DirectoryRoot::open_existing($PATH)
    - pattern: crate::node_state::Scope::open($$$ARGS)
    - pattern: crate::node_state::Scope::open_existing($$$ARGS)
    - pattern: Scope::open($$$ARGS)
    - pattern: Scope::open_existing($$$ARGS)
    - pattern: cap_std::fs::Dir::open_ambient_dir($$$ARGS)
    - pattern: Dir::open_ambient_dir($$$ARGS)

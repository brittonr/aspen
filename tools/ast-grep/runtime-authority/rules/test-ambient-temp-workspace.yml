id: test-ambient-temp-workspace
language: Rust
severity: error
message: Converted test helpers must acquire cap-tempfile workspaces instead of constructing or broadly deleting ambient temporary roots.
metadata:
  posture: blocking
  surface: test-workspace-shells
  non_claim: structural-test-isolation-only
files:
  - src/test/support.rs
  - src/main/tests/ops/helpers.rs
  - src/local_store.rs
  - src/chunk/parts/store/tests/m000/p002/body.rs
  - src/retention/parts/mod/tests/m000/p000/body.rs
  - src/remote/parts/dataspace/tests/m000/p001/body.rs
  - src/iroh/parts/exchange/tests/m000/p001/body.rs
  - src/evidence/parts/chain/tests/m000/p003/body.rs
  - src/node/parts/daemon/tests/m000/p000/body.rs
  - src/node/parts/daemon/tests/m000/p010/body.rs
  - tests/parts/cliharness/p000/body.rs
  - tests/parts/cliharness/p013/body.rs
  - tools/ast-grep/runtime-authority/fixtures/positive/test_ambient_temp_workspace.rs
  - tools/ast-grep/runtime-authority/fixtures/negative/test_capability_workspace.rs
rule:
  any:
    - pattern: std::env::temp_dir()
    - pattern: std::process::id()
    - pattern: std::fs::remove_dir_all($ENTRY.path())
    - pattern: fs::remove_dir_all($ENTRY.path())

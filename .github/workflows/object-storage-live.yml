name: Object storage live

on:
  workflow_dispatch:
  push:
    paths:
      - "src/content_store_adapter/**"
      - "crates/molten-core/src/content_store_adapter/**"
      - "docs/content-store-adapter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/object-storage-live.yml"
  pull_request:
    paths:
      - "src/content_store_adapter/**"
      - "crates/molten-core/src/content_store_adapter/**"
      - "docs/content-store-adapter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/object-storage-live.yml"

jobs:
  live-s3:
    runs-on: ubuntu-latest
    env:
      MOLTEN_S3_ENDPOINT: http://127.0.0.1:28433
      MOLTEN_S3_BUCKET: molten-live
      MOLTEN_CONTENT_RECEIPT_DIR: ${{ github.workspace }}/target/object-storage-ci
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Install checksum-pinned SeaweedFS fixture
        run: bash docs/content-store-adapter/endpoint-fixture.sh install "$RUNNER_TEMP/object-storage"
      - name: Start disposable S3 endpoint
        run: |
          nohup bash docs/content-store-adapter/endpoint-fixture.sh serve "$RUNNER_TEMP/object-storage" \
            > "$RUNNER_TEMP/object-storage/weed.log" 2>&1 &
          bash docs/content-store-adapter/endpoint-fixture.sh bucket "$RUNNER_TEMP/object-storage"
      - name: Check dependency policy and command parity
        run: |
          nix develop --no-update-lock-file .#object-storage-ci -c bash -euo pipefail -c '
            python3 docs/content-store-adapter/dependency-guard.py
            cargo test --locked -p molten-core content_store_adapter::
            cargo test --locked -p molten --lib --features content-store-object-storage content_store_adapter::
            cargo test --locked -p molten --lib --features content-store-object-storage content_store_adapter::live_object::live -- --ignored --test-threads=1
            cargo test --locked -p molten --lib --features content-store-object-storage content_store_adapter::live_object::completion_tests::live_command_conformance_emits_canonical_receipt -- --ignored --exact
            cargo test --locked -p molten --lib --features content-store-object-storage content_store_adapter::live_cache::tests::live_endpoint_roundtrip -- --ignored
            test -f "$MOLTEN_CONTENT_RECEIPT_DIR/object-conformance.preserves"
            test -f "$MOLTEN_CONTENT_RECEIPT_DIR/put-faults.preserves"
          '
      - name: Retain actual conformance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-storage-${{ github.sha }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            target/object-storage-ci/
            ${{ runner.temp }}/object-storage/weed.log

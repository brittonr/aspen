default_install_hook_types:
  - pre-commit
  - pre-push

default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: git-diff-check
        name: git diff whitespace check
        entry: git diff --check
        language: system
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push

      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push

      - id: cargo-octet-check
        name: cargo octet check
        entry: sh -c 'mkdir -p target/tmp && TMPDIR="$PWD/target/tmp" cargo octet check --artifact-dir target/octet-precommit'
        language: system
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push

      - id: cairn-validate
        name: cairn validate
        entry: sh -c 'CAIRN_ROOT="${CAIRN_ROOT:-../cairn}"; nix run "path:$CAIRN_ROOT#cairn" -- validate --root . --policy "$CAIRN_ROOT/cairn-policy/generated/cairn-policy.json"'
        language: system
        pass_filenames: false
        stages:
          - pre-push

default_install_hook_types:
  - pre-commit
  - pre-push

default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: git-diff-check
        name: git diff whitespace check
        entry: git diff --check
        language: system
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push

      - id: cairn-archive-date
        name: reject epoch-dated Cairn archives
        # Cairn names archives 1970-01-01 unless CAIRN_ARCHIVE_DATE is set.
        entry: sh -c '! git diff --cached --name-only --diff-filter=A -- .cairn/archive | grep "^\.cairn/archive/1970-01-01-"'
        language: system
        pass_filenames: false

      - id: evidence-publication-guard
        name: reject host-specific material in published evidence
        # Staged evidence, release and docs files; see CONTRIBUTING.md (Publishing evidence).
        entry: python3 scripts/evidence-publication-guard.py
        language: system
        files: ^(evidence/|release/|docs/|\.cairn/(changes|archive)/[^/]+/evidence/)

      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push

      - id: cargo-octet-check
        name: cargo octet check
        entry: sh -c 'mkdir -p target/tmp && TMPDIR="$PWD/target/tmp" CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/target}" cargo octet check --artifact-dir target/octet-precommit'
        language: system
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push

      - id: cairn-validate
        name: cairn validate --strict (pinned)
        # Same pinned validator and policy export as `checks.cairn-validate-strict`; never a sibling checkout.
        entry: nix run .#cairn-validate-strict
        language: system
        pass_filenames: false
        stages:
          - pre-push

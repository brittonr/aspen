[package]
name = "molten-node-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone Molten normal-node runtime and executable"

[lib]
name = "molten_node_runtime"
path = "src/lib.rs"

[[bin]]
name = "molten-node"
path = "src/bin/molten-node.rs"

[features]
profiler = ["dep:flux-profiler"]
profiler-disabled = ["dep:flux-profiler", "flux-profiler/disable-profiling"]

[dependencies]
artifact-auth-core = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
artifact-auth-ed25519 = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
artifact-binding-core = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
bao-tree = "0.16.0"
blake3 = "1"
cap-fs-ext = "3"
cap-std = "3"
cap-tempfile = "3"
clap = { version = "4", features = ["derive"] }
iroh = "1.0.0"
iroh-blobs = "0.103.0"
iroh-docs = "0.101.0"
iroh-gossip = "0.101.0"
kamacite-core = { git = "ssh://git@github.com/OnixResearch/kamacite.git", rev = "d76fe4abe543724d8fc0ac4b362187caf2e27622", version = "0.1.0" }
molten-core = { path = "../molten-core" }
molten-node-host = { path = "../molten-node-host" }
n0-future = "0.3.2"
preserves = "5.0.0-rc.7"
preserves-schema = "6.0.0-rc.6"
redb = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
steel-core = "0.8.2"
syndicate = "0.44.0-rc.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
toml = "0.9"
tracing = "0.1"
trellis = { git = "ssh://git@github.com/OnixResearch/basalt.git", rev = "89675cd4f585f837323c049e4a25f7b94c903038", version = "0.2.0", package = "verified-logic" }
wasmparser = "0.240"
wasmtime = "45.0.0"
wasmtime-wasi = "45"
zstd = "0.13"

[dev-dependencies]
hegeltest = { git = "https://github.com/hegeldev/hegel-rust", rev = "ed949b8084595cb467e983747f1089e214965ac6", features = ["native"] }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "2a1916465ae6649aebef3758233cfea98e5d33db", version = "0.1.3", optional = true, default-features = false }

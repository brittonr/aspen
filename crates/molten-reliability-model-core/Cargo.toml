[package]
name = "molten-reliability-model-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "no_std register workload, history, and fault-profile models for Aspen live reliability"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
blake3 = "1"
hegeltest = { git = "https://github.com/hegeldev/hegel-rust", rev = "ed949b8084595cb467e983747f1089e214965ac6", features = ["native"] }
serde_json = "1"

[package]
name = "molten-node-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Capability-rooted node host boundary for Aspen"

[dependencies]
cap-fs-ext = "3"
cap-std = "3"
molten-core = { path = "../molten-core" }
# Typed kernel errors (`ViewError`, `BoundError`, `Classified`) convert into `Failure` here.
molten-preserves-core = { path = "../molten-preserves-core" }

[features]
# Dev-only fault-injection seams at lock boundaries; never enabled by production builds.
test-seams = []

[dev-dependencies]
cap-tempfile = "3"
toml = "0.9"

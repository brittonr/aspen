[package]
name = "molten-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Without `std` the crate builds as `#![no_std]` + `alloc`. `std` carries the modules whose upstream
# dependencies (`basalt`, `kamacite-core`) still require the standard library.
default = ["std"]
std = ["dep:basalt", "dep:kamacite-core", "blake3/std", "serde/std"]
executable-extents = ["dep:executable-extent-core"]

[dependencies]
artifact-auth-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", version = "0.1.0" }
artifact-binding-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", version = "0.1.0" }
basalt = { git = "https://github.com/OnixResearch/basalt.git", rev = "89675cd4f585f837323c049e4a25f7b94c903038", version = "0.1.0", optional = true }
blake3 = { version = "1", default-features = false }
choregraph-history = { git = "https://github.com/OnixResearch/choregraph.git", rev = "318d4932d743fe4a583691efb54c070e351b0c1b", version = "0.1.0" }
content-identity-core = { git = "https://seed.radicle.garden/zA14jhTdwST4PxPBdsryc4zS7Kpq.git", rev = "7f55597b5dc879b7601856e8d7fd0dbacaa2a498", version = "0.1.0" }
executable-extent-core = { git = "https://seed.radicle.garden/z37R1bP1kHcELs89RNbQRaqbCVKxB.git", rev = "025d9636f0161777710dac37b3c210ca0ad9483f", optional = true }
kamacite-core = { git = "https://github.com/OnixResearch/kamacite.git", rev = "d76fe4abe543724d8fc0ac4b362187caf2e27622", version = "0.1.0", optional = true }
schema-migration-core = { git = "https://seed.radicle.garden/z1C4YVMgDGyVdQa72uPNj3UDS5cY.git", rev = "4fe90e130f2871cf69a6febcdc70785adca98aea", version = "0.1.0" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
transactional-reconciliation-core = { git = "https://seed.radicle.garden/z4Tky6zvC8w4Y6c4YBzNxVbq5n752.git", rev = "eb2bd3441753af97bfcb247cef7cc22d72675b62", version = "0.1.0" }

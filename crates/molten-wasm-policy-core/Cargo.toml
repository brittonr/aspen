[package]
name = "molten-wasm-policy-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "no_std Wasm component admission, profile, and optimization policy for Aspen"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
hegeltest = { git = "https://github.com/hegeldev/hegel-rust", rev = "ed949b8084595cb467e983747f1089e214965ac6", features = ["native"] }
serde_json = "1"

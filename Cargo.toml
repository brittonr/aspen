[workspace]
members = [".", "crates/molten-core", "crates/molten-node-host", "crates/molten-release-policy"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.metadata.octet]
default_scope = ["-p", "molten", "-p", "molten-node-host"]
cargo_check_args = ["--all-targets"]

[package]
name = "molten"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Aspen: a Rust runtime for distributed systems with explicit authority, bounded effects, and deterministic replay"
default-run = "molten"

[lib]
path = "src/lib.rs"

[features]
chaoscontrol-conformance = ["dep:chaoscontrol-smr"]
doltlite-oracle = []
component-rpc = [
  "dep:anyhow",
  "dep:bytes",
  "dep:wasmtime-rpc",
  "dep:wasmtime-wasi-rpc",
  "dep:wrpc-runtime-wasmtime",
  "dep:wrpc-transport",
]
component-rpc-telemetry = ["component-rpc"]
executable-extents = [
  "dep:data-encoding",
  "dep:executable-extent-conformance",
  "dep:executable-extent-core",
  "dep:executable-extent-linux",
  "molten-core/executable-extents",
]
job-dag-construction = ["dep:choregraph-nickel", "dep:nickel-eval"]
marble-object-store = ["dep:art", "dep:marble"]
profiler = ["dep:flux-profiler"]
profiler-alloc = ["profiler", "flux-profiler/alloc-profile"]
profiler-disabled = ["dep:flux-profiler", "flux-profiler/disable-profiling"]
profiler-perf = ["profiler", "flux-profiler/perf"]
spacewasm-pilot = ["dep:spacewasm"]
world-snapshot-vm-cohort = ["dep:vm-cohort-core"]
content-store-object-storage = ["dep:reqwest", "dep:sha2", "dep:hmac", "dep:time"]
# Test-only fixtures (fabricated evidence for tests). Enabled only through the self
# dev-dependency below, so `cargo build`/`cargo check` of the library and binaries never see it.
test-fixtures = []

[[bin]]
name = "molten"
path = "src/main.rs"

[[test]]
name = "doltlite_oracle"
path = "tests/doltlite_oracle.rs"
required-features = ["doltlite-oracle"]

[[test]]
name = "content_replication"
path = "tests/content_replication/main.rs"

[[test]]
name = "executable_extent"
path = "tests/executable_extent/main.rs"

[[test]]
name = "fabric_simulation_boundary"
path = "tests/fabric_simulation_boundary/main.rs"

[[test]]
name = "outside_in"
path = "tests/outside_in/main.rs"

[[bin]]
name = "molten-native-extension-fixture"
path = "src/bin/molten-native-extension-fixture.rs"

[[bin]]
name = "molten-addressable-counter"
path = "src/addressable_actor/counter/main.rs"

[[bin]]
name = "molten-nickel-eval-worker"
path = "src/bin/molten-nickel-eval-worker.rs"
required-features = ["job-dag-construction"]

[[test]]
name = "job_dag_construction"
path = "tests/job_dag_construction/main.rs"
required-features = ["job-dag-construction"]

[dependencies]
anyhow = { version = "1", optional = true }
art = { version = "=1.0.0", optional = true }
artifact-auth-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", version = "0.1.0" }
artifact-auth-ed25519 = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", version = "0.1.0" }
artifact-binding-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", version = "0.1.0" }
bao-tree = "0.16.0"
basalt = { git = "https://github.com/OnixResearch/basalt.git", rev = "89675cd4f585f837323c049e4a25f7b94c903038", version = "0.1.0" }
blake3 = "1"
bounded-exec = { git = "https://github.com/OnixResearch/bounded-exec.git", rev = "29dac88ecded94457572db3fdfaaaab95fa91525", version = "0.1.0" }
bytes = { version = "1", optional = true }
durable-file-publication = { git = "https://seed.radicle.garden/z3tAR4For7qw8ZirkJzoDw1VNDDLM.git", rev = "8e05e74e24b45f752d77145c4455385daaf6d6ab", version = "0.1.0" }
choregraph-history = { git = "https://github.com/OnixResearch/choregraph.git", rev = "318d4932d743fe4a583691efb54c070e351b0c1b", version = "0.1.0" }
choregraph-nickel = { git = "https://github.com/OnixResearch/choregraph.git", rev = "318d4932d743fe4a583691efb54c070e351b0c1b", version = "0.1.0", optional = true }
chaoscontrol-snapshot-descriptor = { git = "https://github.com/brittonr/chaoscontrol.git", rev = "b8c440ea3b19df796542e58e8ee36200e1c3db85", version = "0.1.0" }
chaoscontrol-smr = { git = "https://github.com/brittonr/chaoscontrol.git", rev = "ec8aa799bad4735bf1028a092ca39feb08fb4bb7", version = "0.1.0", optional = true }
cap-fs-ext = "3"
cap-std = "3"
data-encoding = { version = "2", optional = true }
durable-authority-state-redb = { git = "https://seed.radicle.garden/z3kGDT73ja8rewvGLwJFLF5MTx1ih.git", rev = "a0de79303f3f45c18a34fff535b690a85cb3cf59", version = "0.1.0" }
ed25519-dalek = "2.2"
executable-extent-conformance = { git = "https://seed.radicle.garden/z37R1bP1kHcELs89RNbQRaqbCVKxB.git", rev = "025d9636f0161777710dac37b3c210ca0ad9483f", optional = true }
executable-extent-core = { git = "https://seed.radicle.garden/z37R1bP1kHcELs89RNbQRaqbCVKxB.git", rev = "025d9636f0161777710dac37b3c210ca0ad9483f", optional = true }
executable-extent-linux = { git = "https://seed.radicle.garden/z37R1bP1kHcELs89RNbQRaqbCVKxB.git", rev = "025d9636f0161777710dac37b3c210ca0ad9483f", optional = true }
getrandom = "0.3"
hex = "0.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
hmac = { version = "=0.12.1", optional = true }
time = { version = "=0.3.47", features = ["formatting", "macros"], optional = true }
hardened-wasmtime-runtime = { git = "https://seed.radicle.garden/z3hRCegTsS8jpJVgxYfb9psEzxHpG.git", rev = "57c834dfd0da2f092e2cbbd0e48bb60b61e2d06e", version = "0.1.0" }
hardened-wasmtime-shell = { git = "https://seed.radicle.garden/z3hRCegTsS8jpJVgxYfb9psEzxHpG.git", rev = "57c834dfd0da2f092e2cbbd0e48bb60b61e2d06e", version = "0.1.0" }
marble = { version = "=16.0.2", optional = true }
mantle-wasm-consumer-verifier = { git = "https://github.com/OnixResearch/mantle.git", rev = "dd2bebab894688d07e7a29c75c1437f4ecc120df", version = "0.1.0" }
molten-core = { path = "crates/molten-core" }
molten-node-host = { path = "crates/molten-node-host" }
cairn = { git = "https://github.com/OnixResearch/cairn.git", rev = "3b4c280b893f2709aebea21fc51a4f9eeba3fe3b", package = "cairn-core" }
clap = { version = "4", features = ["derive", "env"] }
iroh = "1.0.0"
iroh-blobs = "0.103.0"
iroh-docs = "0.101.0"
iroh-gossip = "0.101.0"
kamacite-core = { git = "https://github.com/OnixResearch/kamacite.git", rev = "d76fe4abe543724d8fc0ac4b362187caf2e27622", version = "0.1.0" }
n0-future = "0.3.2"
nickel-eval = { git = "https://seed.radicle.garden/z21miuQLqLwe1HkaMu2mEZy5fdG9F.git", rev = "2d1fb2b59f373967cc69e13ec289759d9cd4df46", version = "0.1.0", optional = true }
nickel-lang = "2.2.0"
valence = { git = "https://github.com/OnixResearch/valence.git", rev = "9201074343cd9da0ffaf6ec9db690af5b445d663", package = "valence-core" }
preserves = "5.0.0-rc.10"
preserves-schema = "6.0.0-rc.6"
redb = "4.1.0"
replay-ledger-core = { git = "https://seed.radicle.garden/z3kGDT73ja8rewvGLwJFLF5MTx1ih.git", rev = "a0de79303f3f45c18a34fff535b690a85cb3cf59", version = "0.1.0" }
revocation-view-core = { git = "https://seed.radicle.garden/z3kGDT73ja8rewvGLwJFLF5MTx1ih.git", rev = "a0de79303f3f45c18a34fff535b690a85cb3cf59", version = "0.1.0" }
release-channel-index = { git = "https://github.com/OnixResearch/release-channel.git", rev = "fa389e19d5c9bd84cd75df914cc5418c70d92bfb", version = "0.1.0" }
release-channel-witness = { git = "https://github.com/OnixResearch/release-channel.git", rev = "fa389e19d5c9bd84cd75df914cc5418c70d92bfb", version = "0.1.0" }
rustix = { version = "1", features = ["event", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schema-identity-core = { git = "https://seed.radicle.garden/z6gGpUJtzdVBCCtZTzh4cV1skv4H.git", rev = "2562c8aa38a034061f9af9f3e17280494a5b8de2" }
schema-migration-core = { git = "https://seed.radicle.garden/z1C4YVMgDGyVdQa72uPNj3UDS5cY.git", rev = "4fe90e130f2871cf69a6febcdc70785adca98aea", version = "0.1.0" }
transactional-reconciliation-core = { git = "https://seed.radicle.garden/z4Tky6zvC8w4Y6c4YBzNxVbq5n752.git", rev = "eb2bd3441753af97bfcb247cef7cc22d72675b62", version = "0.1.0" }
snafu = "0.8"
spacewasm = { git = "https://github.com/nasa/spacewasm", rev = "e24cf09355a90497148eb5029fdb8e3400bd63e3", default-features = false, optional = true }
steel-core = "0.8.2"
tar = "0.4"

syndicate = "0.44.0-rc.9"
tempfile = "3"
toml = "0.9"
tracing = "0.1"
trellis = { git = "https://github.com/OnixResearch/basalt.git", rev = "89675cd4f585f837323c049e4a25f7b94c903038", version = "0.2.0", package = "verified-logic" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
vm-cohort-core = { path = "vendor/vm-cohort/crates/vm-cohort-core", version = "0.1.0", optional = true }
wasmparser = "0.240"
wasmtime = "49.0.5"
wasmtime-wasi = "49"
wasmtime-rpc = { package = "wasmtime", version = "=33.0.0", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"], optional = true }
wasmtime-wasi-rpc = { package = "wasmtime-wasi", version = "=33.0.0", default-features = false, optional = true }
wit-bindgen = "0.46"
wrpc-runtime-wasmtime = { git = "https://github.com/bytecodealliance/wrpc", rev = "aa01409ed38bf7a978570ff567c4475376925df6", default-features = false, optional = true }
wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc", rev = "aa01409ed38bf7a978570ff567c4475376925df6", default-features = false, optional = true }
zstd = "0.13"

[dev-dependencies]
cap-tempfile = "3"
molten = { path = ".", features = ["test-fixtures"] }
# Dev-only lock-boundary seams for deterministic concurrency regressions; no new crate.
molten-node-host = { path = "crates/molten-node-host", features = ["test-seams"] }
schema-identity-conformance = { git = "https://seed.radicle.garden/z6gGpUJtzdVBCCtZTzh4cV1skv4H.git", rev = "2562c8aa38a034061f9af9f3e17280494a5b8de2" }
hegeltest = { git = "https://github.com/hegeldev/hegel-rust", rev = "ed949b8084595cb467e983747f1089e214965ac6", features = ["native"] }
quint-connect = { git = "https://github.com/quint-co/quint-connect.git", rev = "4f018f54fc7dd4cef341d10111427bab59d3b307", version = "=0.1.2" }

wat = "1"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "2a1916465ae6649aebef3758233cfea98e5d33db", version = "0.1.3", optional = true, default-features = false }

[target.'cfg(not(all(target_arch = "x86_64", target_os = "linux")))'.dependencies]
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "2a1916465ae6649aebef3758233cfea98e5d33db", version = "0.1.3", optional = true, default-features = false, features = ["disable-profiling"] }

# Valence 920107 declares Artifact over SSH. Redirect that transitive declaration to the
# same immutable HTTPS source so the default graph does not require GitHub SSH credentials.
[patch."ssh://git@github.com/OnixResearch/onix-artifact.git"]
artifact-auth-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52" }
artifact-auth-ed25519 = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52" }

# nickel-lang-core declares `links = "nix"`, so a dependency graph holds one copy. Resolve the
# embedded cohort to nickel-eval's owned import of the same reviewed archives (tracked captured,
# local-core and closurization patches); docs/nickel-toolchain.md records the source.
[patch.crates-io]
nickel-lang = { git = "https://seed.radicle.garden/z21miuQLqLwe1HkaMu2mEZy5fdG9F.git", rev = "2d1fb2b59f373967cc69e13ec289759d9cd4df46" }
nickel-lang-core = { git = "https://seed.radicle.garden/z21miuQLqLwe1HkaMu2mEZy5fdG9F.git", rev = "2d1fb2b59f373967cc69e13ec289759d9cd4df46" }

# Molten-owned crates trap integer overflow in release builds; flake.nix passes the same option to
# these crates because nixpkgs buildRustCrate ignores Cargo profiles (docs/development.md).
[profile.release.package.molten]
overflow-checks = true

[profile.release.package.molten-core]
overflow-checks = true

[profile.release.package.molten-node-host]
overflow-checks = true

[profile.release.package.molten-release-policy]
overflow-checks = true

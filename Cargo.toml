steel-core = "0.8.2"
tar = "0.4"

syndicate = "0.44.0-rc.3"
tempfile = "3"
toml = "0.9"
tracing = "0.1"
trellis = { git = "https://github.com/OnixResearch/basalt.git", rev = "89675cd4f585f837323c049e4a25f7b94c903038", version = "0.2.0", package = "verified-logic" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[workspace]
members = [".", "crates/molten-core", "crates/molten-node-host", "crates/molten-release-policy"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.metadata.octet]
default_scope = ["-p", "molten", "-p", "molten-node-host"]
cargo_check_args = ["--all-targets"]

[package]
name = "molten"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Molten Rust project"

[lib]
path = "src/lib.rs"

[features]
doltlite-oracle = []
executable-extents = [
  "dep:data-encoding",
  "dep:executable-extent-conformance",
  "dep:executable-extent-core",
  "dep:executable-extent-linux",
  "molten-core/executable-extents",
]
profiler = ["dep:flux-profiler"]
profiler-alloc = ["profiler", "flux-profiler/alloc-profile"]
profiler-disabled = ["dep:flux-profiler", "flux-profiler/disable-profiling"]
profiler-perf = ["profiler", "flux-profiler/perf"]
world-snapshot-vm-cohort = ["dep:vm-cohort-core"]

[[bin]]
name = "molten"
path = "src/main.rs"

[[test]]
name = "doltlite_oracle"
path = "tests/doltlite_oracle.rs"
required-features = ["doltlite-oracle"]

[[bin]]
name = "molten-native-extension-fixture"
path = "src/bin/molten-native-extension-fixture.rs"

[dependencies]
artifact-auth-core = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
artifact-auth-ed25519 = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
artifact-binding-core = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
bao-tree = "0.16.0"
basalt = { git = "ssh://git@github.com/OnixResearch/basalt.git", rev = "89675cd4f585f837323c049e4a25f7b94c903038", version = "0.1.0" }
blake3 = "1"
bounded-exec = { git = "https://git.onix.computer/z2CpqLFpdP36fZXYUK5ZNWxMibpCo.git", rev = "29dac88ecded94457572db3fdfaaaab95fa91525", version = "0.1.0" }
choregraph-history = { git = "https://seed.radicle.garden/zL2ncTUeASVYwcoGkEXv9JKgGbAF.git", rev = "b3e08e19750f53bdbcae970cdf58a47a791ed20b", version = "0.1.0" }
chaoscontrol-snapshot-descriptor = { git = "https://github.com/brittonr/chaoscontrol.git", rev = "b8c440ea3b19df796542e58e8ee36200e1c3db85", version = "0.1.0" }
cap-fs-ext = "3"
cap-std = "3"
data-encoding = { version = "2", optional = true }
executable-extent-conformance = { git = "rad://z37R1bP1kHcELs89RNbQRaqbCVKxB", rev = "025d9636f0161777710dac37b3c210ca0ad9483f", optional = true }
executable-extent-core = { git = "rad://z37R1bP1kHcELs89RNbQRaqbCVKxB", rev = "025d9636f0161777710dac37b3c210ca0ad9483f", optional = true }
executable-extent-linux = { git = "rad://z37R1bP1kHcELs89RNbQRaqbCVKxB", rev = "025d9636f0161777710dac37b3c210ca0ad9483f", optional = true }
molten-core = { path = "crates/molten-core" }
molten-node-host = { path = "crates/molten-node-host" }
cairn = { git = "ssh://git@github.com/OnixResearch/cairn.git", rev = "3b4c280b893f2709aebea21fc51a4f9eeba3fe3b", package = "cairn-core" }
clap = { version = "4", features = ["derive"] }
iroh = "1.0.0"
iroh-blobs = "0.103.0"
iroh-docs = "0.101.0"
iroh-gossip = "0.101.0"
kamacite-core = { git = "ssh://git@github.com/OnixResearch/kamacite.git", rev = "d76fe4abe543724d8fc0ac4b362187caf2e27622", version = "0.1.0" }
n0-future = "0.3.2"
nickel-lang = "2.2.0"
valence = { git = "ssh://git@github.com/OnixResearch/valence.git", rev = "5f1c2ba5072c6f9622fa59b1af20502985f569fd", package = "valence-core" }
preserves = "5.0.0-rc.7"
preserves-schema = "6.0.0-rc.6"
redb = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schema-identity-core = { git = "https://seed.radicle.garden/z6gGpUJtzdVBCCtZTzh4cV1skv4H.git", rev = "2562c8aa38a034061f9af9f3e17280494a5b8de2" }
schema-migration-core = { git = "https://seed.radicle.garden/z1C4YVMgDGyVdQa72uPNj3UDS5cY.git", rev = "4fe90e130f2871cf69a6febcdc70785adca98aea", version = "0.1.0" }
transactional-reconciliation-core = { git = "https://seed.radicle.garden/z4Tky6zvC8w4Y6c4YBzNxVbq5n752.git", rev = "eb2bd3441753af97bfcb247cef7cc22d72675b62", version = "0.1.0" }
snafu = "0.8"
steel-core = "0.8.2"
tar = "0.4"

syndicate = "0.44.0-rc.3"
toml = "0.9"
tracing = "0.1"
trellis = { git = "ssh://git@github.com/OnixResearch/basalt.git", rev = "89675cd4f585f837323c049e4a25f7b94c903038", version = "0.2.0", package = "verified-logic" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
vm-cohort-core = { git = "rad://z2QJLUqyAZnnHPiZQ1BFjLsX9ush3", rev = "31f1696ba9391bfda8577a58af84f72361d5573e", version = "0.1.0", optional = true }
wasmparser = "0.240"
wasmtime = "45.0.0"
wasmtime-wasi = "45"
wit-bindgen = "0.46"
zstd = "0.13"

[dev-dependencies]
cap-tempfile = "3"
schema-identity-conformance = { git = "https://seed.radicle.garden/z6gGpUJtzdVBCCtZTzh4cV1skv4H.git", rev = "2562c8aa38a034061f9af9f3e17280494a5b8de2" }
hegeltest = { git = "https://github.com/hegeldev/hegel-rust", rev = "ed949b8084595cb467e983747f1089e214965ac6", features = ["native"] }

wat = "1"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "2a1916465ae6649aebef3758233cfea98e5d33db", version = "0.1.3", optional = true, default-features = false }

[target.'cfg(not(all(target_arch = "x86_64", target_os = "linux")))'.dependencies]
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "2a1916465ae6649aebef3758233cfea98e5d33db", version = "0.1.3", optional = true, default-features = false, features = ["disable-profiling"] }

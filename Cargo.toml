[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.metadata.octet]
default_scope = ["-p", "molten"]
cargo_check_args = ["--all-targets"]

[package]
name = "molten"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Molten Rust project"

[lib]
path = "src/lib.rs"

[[bin]]
name = "molten"
path = "src/main.rs"

[dependencies]
basalt = { git = "ssh://git@github.com/OnixResearch/basalt.git", version = "0.1.0" }
blake3 = "1"
cairn = { git = "ssh://git@github.com/OnixResearch/cairn.git", package = "cairn-core" }
clap = { version = "4", features = ["derive"] }
iroh = "1.0.0-rc.1"
iroh-blobs = "0.102.0"
iroh-docs = "0.100.0"
iroh-gossip = "0.100.0"
n0-future = "0.3.2"
nickel-lang = "2.1.0"
octet = { git = "ssh://git@github.com/OnixResearch/octet.git", package = "valence-core" }
preserves = "5.0.0-rc.7"
preserves-schema = "6.0.0-rc.6"
redb = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
steel-core = "0.8.2"
tar = "0.4"

syndicate = "0.44.0-rc.3"
toml = "0.9"
tracing = "0.1"
trellis = { git = "ssh://git@github.com/OnixResearch/trellis.git", version = "0.2.0", package = "verified-logic" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wasmparser = "0.240"
wasmtime = "45.0.0"
wasmtime-wasi = "45"
wit-bindgen = "0.46"
zstd = "0.13"

[dev-dependencies]
hegeltest = { git = "https://github.com/hegeldev/hegel-rust", features = ["native"] }
wat = "1"

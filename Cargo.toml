molten-core = { path = "crates/molten-core" }
molten-node-host = { path = "crates/molten-node-host" }
cairn = { git = "https://github.com/OnixResearch/cairn.git", rev = "3b4c280b893f2709aebea21fc51a4f9eeba3fe3b", package = "cairn-core" }
clap = { version = "4", features = ["derive", "env"] }
iroh = "1.0.0"

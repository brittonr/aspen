release-channel-witness = { git = "https://github.com/OnixResearch/release-channel.git", rev = "fa389e19d5c9bd84cd75df914cc5418c70d92bfb", version = "0.1.0" }
rustix = { version = "1", features = ["event", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schema-identity-core = { git = "https://seed.radicle.garden/z6gGpUJtzdVBCCtZTzh4cV1skv4H.git", rev = "2562c8aa38a034061f9af9f3e17280494a5b8de2" }

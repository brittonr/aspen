[workspace]
members = [".", "crates/molten-core", "crates/molten-release-policy"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.metadata.octet]
default_scope = ["-p", "molten"]
cargo_check_args = ["--all-targets"]

[package]
name = "molten"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Molten Rust project"

[lib]
path = "src/lib.rs"

[[bin]]
name = "molten"
path = "src/main.rs"

[dependencies]
artifact-auth-core = { git = "https://git.onix.computer/z4JGYYW7WsesXUq7MXVdx16Fawu2f.git", rev = "799459346d5416fbd7b9f55840a7371441b55afa", version = "0.1.0" }
artifact-auth-ed25519 = { git = "https://git.onix.computer/z4JGYYW7WsesXUq7MXVdx16Fawu2f.git", rev = "799459346d5416fbd7b9f55840a7371441b55afa", version = "0.1.0" }
artifact-binding-core = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
bao-tree = "0.16.0"
basalt = { git = "ssh://git@github.com/OnixResearch/basalt.git", rev = "d913dc01e765c9b297df5fcc57dfa06aac39bc74", version = "0.1.0" }
blake3 = "1"
cap-fs-ext = "3"
cap-std = "3"
molten-core = { path = "crates/molten-core" }
cairn = { git = "ssh://git@github.com/OnixResearch/cairn.git", rev = "3b4c280b893f2709aebea21fc51a4f9eeba3fe3b", package = "cairn-core" }
clap = { version = "4", features = ["derive"] }
iroh = "1.0.0"
iroh-blobs = "0.103.0"
iroh-docs = "0.101.0"
iroh-gossip = "0.101.0"
kamacite-core = { git = "ssh://git@github.com/OnixResearch/kamacite.git", rev = "d76fe4abe543724d8fc0ac4b362187caf2e27622", version = "0.1.0" }
n0-future = "0.3.2"
nickel-lang = "2.1.0"
valence = { git = "ssh://git@github.com/OnixResearch/valence.git", rev = "5f1c2ba5072c6f9622fa59b1af20502985f569fd", package = "valence-core" }
preserves = "5.0.0-rc.7"
preserves-schema = "6.0.0-rc.6"
redb = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
steel-core = "0.8.2"
tar = "0.4"

syndicate = "0.44.0-rc.3"
toml = "0.9"
tracing = "0.1"
trellis = { git = "ssh://git@github.com/OnixResearch/ucan.git", rev = "2aad993027d48ff148028c537cdaf91f6e5285ca", version = "0.2.0", package = "verified-logic" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wasmparser = "0.240"
wasmtime = "45.0.0"
wasmtime-wasi = "45"
wit-bindgen = "0.46"
zstd = "0.13"

[dev-dependencies]
cap-tempfile = "3"
hegeltest = { git = "https://github.com/hegeldev/hegel-rust", rev = "ed949b8084595cb467e983747f1089e214965ac6", features = ["native"] }

wat = "1"

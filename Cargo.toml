[workspace]
members = [".", "crates/molten-core", "crates/molten-node-host", "crates/molten-release-policy"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.metadata.octet]
default_scope = ["-p", "molten", "-p", "molten-node-host"]
cargo_check_args = ["--all-targets"]

[package]
name = "molten"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Molten Rust project"
default-run = "molten"

[lib]
path = "src/lib.rs"

[features]
doltlite-oracle = []
component-rpc = [
  "dep:anyhow",
  "dep:bytes",
  "dep:wasmtime-rpc",
  "dep:wasmtime-wasi-rpc",
  "dep:wrpc-runtime-wasmtime",
  "dep:wrpc-transport",
]
component-rpc-telemetry = ["component-rpc"]
executable-extents = [
  "dep:data-encoding",
  "dep:executable-extent-conformance",
  "dep:executable-extent-core",
  "dep:executable-extent-linux",
  "molten-core/executable-extents",
]
marble-object-store = ["dep:art", "dep:marble"]
profiler = ["dep:flux-profiler"]
profiler-alloc = ["profiler", "flux-profiler/alloc-profile"]
profiler-disabled = ["dep:flux-profiler", "flux-profiler/disable-profiling"]
profiler-perf = ["profiler", "flux-profiler/perf"]
spacewasm-pilot = ["dep:spacewasm"]
world-snapshot-vm-cohort = ["dep:vm-cohort-core"]

[[bin]]
name = "molten"
path = "src/main.rs"

[[test]]
name = "doltlite_oracle"
path = "tests/doltlite_oracle.rs"
required-features = ["doltlite-oracle"]

[[test]]
name = "content_replication"
path = "tests/content_replication/main.rs"

[[test]]
name = "executable_extent"
path = "tests/executable_extent/main.rs"

[[test]]
name = "fabric_simulation_boundary"
path = "tests/fabric_simulation_boundary/main.rs"

[[test]]
name = "outside_in"
path = "tests/outside_in/main.rs"

[[bin]]
name = "molten-native-extension-fixture"
path = "src/bin/molten-native-extension-fixture.rs"

[dependencies]
anyhow = { version = "1", optional = true }
art = { version = "=1.0.0", optional = true }
artifact-auth-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", version = "0.1.0" }
artifact-auth-ed25519 = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", version = "0.1.0" }
artifact-binding-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", version = "0.1.0" }
bao-tree = "0.16.0"
basalt = { git = "https://github.com/OnixResearch/basalt.git", rev = "89675cd4f585f837323c049e4a25f7b94c903038", version = "0.1.0" }
blake3 = "1"
bounded-exec = { git = "https://git.onix.computer/z2CpqLFpdP36fZXYUK5ZNWxMibpCo.git", rev = "29dac88ecded94457572db3fdfaaaab95fa91525", version = "0.1.0" }
bytes = { version = "1", optional = true }
durable-file-publication = { git = "https://git.onix.computer/z3tAR4For7qw8ZirkJzoDw1VNDDLM.git", rev = "8e05e74e24b45f752d77145c4455385daaf6d6ab", version = "0.1.0" }
choregraph-history = { git = "https://seed.radicle.garden/zL2ncTUeASVYwcoGkEXv9JKgGbAF.git", rev = "b3e08e19750f53bdbcae970cdf58a47a791ed20b", version = "0.1.0" }
chaoscontrol-snapshot-descriptor = { git = "https://github.com/brittonr/chaoscontrol.git", rev = "b8c440ea3b19df796542e58e8ee36200e1c3db85", version = "0.1.0" }
cap-fs-ext = "3"
cap-std = "3"
data-encoding = { version = "2", optional = true }
durable-authority-state-redb = { git = "https://seed.radicle.garden/z3kGDT73ja8rewvGLwJFLF5MTx1ih.git", rev = "a0de79303f3f45c18a34fff535b690a85cb3cf59", version = "0.1.0" }

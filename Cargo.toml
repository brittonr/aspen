wat = "1"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "2a1916465ae6649aebef3758233cfea98e5d33db", version = "0.1.3", optional = true, default-features = false }

[target.'cfg(not(all(target_arch = "x86_64", target_os = "linux")))'.dependencies]
flux-profiler = { git = "https://github.com/gattaca-com/flux", rev = "2a1916465ae6649aebef3758233cfea98e5d33db", version = "0.1.3", optional = true, default-features = false, features = ["disable-profiling"] }

# Valence 920107 declares Artifact over SSH. Redirect that transitive declaration to the
# same immutable HTTPS source so the default graph does not require GitHub SSH credentials.
[patch."ssh://git@github.com/OnixResearch/onix-artifact.git"]
artifact-auth-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52" }
artifact-auth-ed25519 = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52" }

[workspace]
resolver = "3"
members = ["."]

[workspace.metadata.octet]
default_scope = ["--workspace"]
cargo_check_args = ["--all-targets", "--all-features"]

[package]
name = "molten-world-head-octet"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "=1.8.5"
choregraph-history = { git = "https://github.com/OnixResearch/choregraph.git", rev = "318d4932d743fe4a583691efb54c070e351b0c1b", version = "0.1.0" }

[patch."https://github.com/OnixResearch/choregraph.git"]
choregraph-history = { path = "vendor/choregraph-history" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

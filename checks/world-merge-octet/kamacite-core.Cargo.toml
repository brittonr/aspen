# Standalone manifest for the pinned Kamacite core in the focused Nix producer.
# Rust sources and included adapter profiles come from kamaciteSource unchanged.
[package]
name = "kamacite-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OnixResearch/kamacite"
rust-version = "1.88"

[dependencies]
blake3 = "=1.8.5"
preserves = { version = "=5.0.0-rc.7", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }

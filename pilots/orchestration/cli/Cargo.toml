# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "molten-orchestrator-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
molten-batch-core = { path = "../batch-core" }
molten-batch-application = { path = "../batch-application" }
molten-orchestrator-codec = { path = "../codec" }
molten-orchestrator-adapters = { path = "../adapters" }
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[[bin]]
name = "molten-orchestrator"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
